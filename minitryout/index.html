<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Try Out System — CBT Online</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<!-- Google Font: Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #f7f8fa;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text: #18181b;
    --text-muted: #71717a;
    --primary: #0f172a;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #f59e0b;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
    --shadow-md: 0 4px 16px rgba(15,23,42,.08);
    --shadow-lg: 0 12px 32px rgba(15,23,42,.12);
  }

  *{ box-sizing: border-box; }
  body{
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .auth-wrapper, .setup-wrapper, .result-wrapper{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .custom-card{
    width: 100%;
    max-width: 500px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    padding: 40px 36px;
  }
  .system-logo{
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--primary);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    margin-bottom: 20px;
  }
  .form-label{ font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .form-control, .form-control:focus{
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 10px 14px;
    font-size: 14px;
    box-shadow: none;
  }
  .form-control:focus{ border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn-custom{
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    padding: 11px;
    width: 100%;
    transition: opacity .15s ease;
  }
  .btn-custom:hover{ opacity: .88; color:#fff; }
  .alert-box{ font-size: 13px; border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; display: none; }

  /* Exam Arena Styles */
  .exam-navbar{ position: sticky; top: 0; z-index: 1030; background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; }
  .timer-badge{
    font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px;
    background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 6px 14px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .timer-badge.timer-danger{ background: #fef2f2; color: var(--danger); animation: pulse-danger 1s infinite; }
  @keyframes pulse-danger{ 0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,.35); } 50% { box-shadow: 0 0 0 6px rgba(220,38,38,0); } }
  
  .exam-body{ max-width: 1180px; margin: 0 auto; padding: 24px 20px 100px; }
  .question-panel{ background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 28px; min-height: 420px; display: flex; flex-direction: column; }
  .question-index-badge{ display:inline-block; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 4px 10px; margin-bottom: 14px; }
  .question-text{ font-size: 17px; font-weight: 500; line-height: 1.6; color: var(--text); margin-bottom: 24px; white-space: pre-wrap; }

  .option-item{
    display: flex; align-items: flex-start; gap: 12px;
    border: 1.5px solid var(--border); border-radius: 10px; padding: 13px 16px; margin-bottom: 10px; cursor: pointer; transition: all .15s;
  }
  .option-item:hover{ border-color: #c7cdd6; background: #fafafa; }
  .option-item.selected{ border-color: var(--accent); background: var(--accent-soft); }
  .option-letter{ flex: 0 0 26px; height: 26px; width: 26px; border-radius: 7px; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12.5px; color: var(--text-muted); }
  .option-item.selected .option-letter{ background: var(--accent); border-color: var(--accent); color: #fff; }
  
  .nav-sidebar{ background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 20px; }
  .nav-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 8px; max-height: 360px; overflow-y: auto; }
  .nav-grid-item{ aspect-ratio: 1/1; border-radius: 8px; border: 1.5px solid var(--border); background: #fff; color: var(--text-muted); font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .nav-grid-item.answered{ background: var(--accent); border-color: var(--accent); color: #fff; }
  .nav-grid-item.marked{ background: var(--warning); border-color: var(--warning); color: #fff; }
  .nav-grid-item.current{ outline: 2.5px solid var(--primary); outline-offset: 1.5px; }
  
  .result-score{ font-size: 56px; font-weight: 800; color: var(--primary); line-height: 1; margin: 10px 0 4px; }
  .result-stats{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 28px 0 8px; }
  .stat-box{ border: 1px solid var(--border); border-radius: 10px; padding: 14px 8px; text-align: center; }
  .stat-box .num{ font-size: 20px; font-weight: 700; }
  .stat-box.correct .num{ color: var(--success); }
  .stat-box.wrong .num{ color: var(--danger); }
  .stat-box.empty .num{ color: var(--text-muted); }
</style>

<!-- Firebase SDKs (Compat v9) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="app"></div>

<!-- Modal Konfirmasi Submit -->
<div class="modal fade" id="submitModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:14px; border:none;">
      <div class="modal-body p-4">
        <h5 class="fw-bold mb-2">Kumpulkan Jawaban?</h5>
        <p class="text-muted small mb-3" id="submitModalDesc">Pastikan jawaban sudah dicek.</p>
        <div class="d-flex gap-2 justify-content-end">
          <button type="button" class="btn btn-outline-secondary btn-sm px-3" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-danger btn-sm px-3" id="confirmSubmitBtn">Ya, Kumpulkan</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
(function(){
  "use strict";

  // ==========================================
  // KONFIGURASI FIREBASE KAMU (SUDAH TERPASANG)
  // ==========================================
  const firebaseConfig = {
    apiKey: "AIzaSyCfcLnl5HyOZImzZIGqIygcZ2UOZW0W8ww",
    authDomain: "minitryout-92efd.firebaseapp.com",
    databaseURL: "https://minitryout-92efd-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "minitryout-92efd",
    storageBucket: "minitryout-92efd.firebasestorage.app",
    messagingSenderId: "624696081103",
    appId: "1:624696081103:web:960a65a4c4335c61ab15ba",
    measurementId: "G-BMCNX53L3Z"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const STORAGE_KEY = "cbt_exam_state_morfologi";
  const appEl = document.getElementById("app");
  let state = null;
  let timerIntervalId = null;

  function router(){
    const hash = window.location.hash;
    if(hash === "#admin"){
      renderAdminAuthOrDashboard();
    } else {
      initParticipantApp();
    }
  }

  window.addEventListener("hashchange", router);

  // ==========================================
  // 1. HALAMAN PESERTA (DEFAULT)
  // ==========================================
  function initParticipantApp(){
    const saved = loadState();
    if(saved && saved.questions && saved.endTime){
      state = saved;
      if(state.endTime - Date.now() <= 0){
        clearState();
        renderSetup("Waktu ujian telah habis.");
      } else {
        renderExam();
        startTimer();
      }
    } else {
      renderSetup();
    }
  }

  function renderSetup(errText){
    appEl.innerHTML = `
      <div class="setup-wrapper">
        <div class="custom-card">
          <div class="system-logo"><i class="bi bi-mortarboard-fill"></i></div>
          <h1 class="fw-bold fs-4 mb-1">Try Out Peserta</h1>
          <p class="text-muted small mb-4">Masukkan data diri dan kode ujian dari admin.</p>
          <div id="alertBox" class="alert-box alert alert-danger" style="display:${errText?'block':'none'}">${errText||''}</div>
          <form id="participantForm">
            <div class="mb-3">
              <label class="form-label">Nama Lengkap</label>
              <input type="text" class="form-control" id="pName" placeholder="Contoh: Siti Rahma" required>
            </div>
            <div class="mb-4">
              <label class="form-label">Kode Try Out</label>
              <input type="text" class="form-control" id="pCode" placeholder="Contoh: UTBK-01" style="text-transform:uppercase" required>
            </div>
            <button type="submit" class="btn-custom" id="startBtn">Mulai Ujian</button>
          </form>
          <div class="text-center mt-3"><a href="#admin" class="text-muted small text-decoration-none">Login Admin</a></div>
        </div>
      </div>
    `;

    document.getElementById("participantForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("pName").value.trim();
      const code = document.getElementById("pCode").value.trim().toUpperCase();
      const btn = document.getElementById("startBtn");

      btn.disabled = true;
      btn.textContent = "Memuat Soal...";

      try {
        const docRef = db.collection("morfologi_tryouts").doc(code);
        const docSnap = await docRef.get();

        if(!docSnap.exists){
          throw new Error("Kode Try Out tidak ditemukan.");
        }

        const data = docSnap.data();
        
        // Jika menggunakan sistem link CSV, tarik data terbaru dari link tersebut saat peserta mulai
        let questionsToUse = data.soal;
        if(data.csvLink){
          const res = await fetch(data.csvLink);
          if(res.ok){
            const csvText = await res.text();
            const lines = csvText.split("\n");
            const freshSoal = [];
            for(let i = 1; i < lines.length; i++){
              const line = lines[i].trim();
              if(!line) continue;
              const cols = line.split(",").map(c => c.trim().replace(/^"|"$/g, ''));
              if(cols.length >= 8){
                freshSoal.push({
                  No: cols[0] || (freshSoal.length + 1),
                  Teks_Soal: cols[1],
                  Opsi_A: cols[2],
                  Opsi_B: cols[3],
                  Opsi_C: cols[4],
                  Opsi_D: cols[5],
                  Opsi_E: cols[6],
                  Kunci_Jawaban: cols[7].toUpperCase()
                });
              }
            }
            if(freshSoal.length > 0) freshSoal.sort((a, b) => Number(a.No) - Number(b.No));
            if(freshSoal.length > 0) questionsToUse = freshSoal;
          }
        }

        state = {
          userName: name,
          code: code,
          durationMinutes: data.durasi,
          endTime: Date.now() + (data.durasi * 60 * 1000),
          questions: questionsToUse,
          answers: {},
          marked: {},
          currentIndex: 0
        };

        saveState();
        renderExam();
        startTimer();
      } catch(err){
        renderSetup(err.message);
      }
    });
  }

  // ==========================================
  // 2. HALAMAN ADMIN (TERSEMBUNYI DI #admin)
  // ==========================================
  function renderAdminAuthOrDashboard(){
    auth.onAuthStateChanged(user => {
      if(user){
        renderAdminDashboard(user);
      } else {
        renderAdminLogin();
      }
    });
  }

  function renderAdminLogin(){
    appEl.innerHTML = `
      <div class="auth-wrapper">
        <div class="custom-card">
          <div class="system-logo bg-danger"><i class="bi bi-shield-lock-fill"></i></div>
          <h1 class="fw-bold fs-4 mb-1">Admin Control</h1>
          <p class="text-muted small mb-4">Masuk untuk mengelola bank soal.</p>
          <div id="adminAlert" class="alert-box alert alert-danger"></div>
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email Admin</label>
              <input type="email" class="form-control" id="adminEmail" required>
            </div>
            <div class="mb-4">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="adminPass" required>
            </div>
            <button type="submit" class="btn-custom bg-danger" id="loginBtn">Login Admin</button>
          </form>
          <div class="text-center mt-3"><a href="#" class="text-muted small text-decoration-none">Kembali ke Peserta</a></div>
        </div>
      </div>
    `;

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("adminEmail").value;
      const pass = document.getElementById("adminPass").value;
      try {
        await auth.signInWithEmailAndPassword(email, pass);
      } catch(err){
        const box = document.getElementById("adminAlert");
        box.textContent = err.message;
        box.style.display = "block";
      }
    });
  }

  function renderAdminDashboard(user){
    appEl.innerHTML = `
      <div class="container py-5" style="max-width: 800px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 class="fw-bold m-0">Admin Dashboard</h3>
          <button class="btn btn-outline-danger btn-sm" id="logoutBtn">Logout</button>
        </div>

        <div class="custom-card" style="max-width: 100%;">
          <h5 class="fw-bold mb-3">Hubungkan Try Out via Link CSV Google Sheets</h5>
          <div id="adminMsg" class="alert-box alert alert-success"></div>
          <form id="createForm">
            <div class="row mb-3">
              <div class="col-md-8">
                <label class="form-label">Kode Try Out (Unik)</label>
                <input type="text" class="form-control" id="newCode" placeholder="Contoh: KE1" style="text-transform:uppercase" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Durasi (Menit)</label>
                <input type="number" class="form-control" id="newDurasi" value="90" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Link CSV Google Sheets</label>
              <input type="url" class="form-control" id="csvLink" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv" required>
              <small class="text-muted">Cukup masukkan link pub?output=csv dari Google Sheets kamu.</small>
            </div>
            <button type="submit" class="btn-custom" id="saveBtn">Simpan Link ke Firebase</button>
          </form>
        </div>
      </div>
    `;

    document.getElementById("logoutBtn").addEventListener("click", () => auth.signOut());

    document.getElementById("createForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const code = document.getElementById("newCode").value.trim().toUpperCase();
      const durasi = parseInt(document.getElementById("newDurasi").value, 10);
      const csvLink = document.getElementById("csvLink").value.trim();
      const saveBtn = document.getElementById("saveBtn");
      const msgBox = document.getElementById("adminMsg");

      saveBtn.disabled = true;
      saveBtn.textContent = "Memverifikasi Link CSV...";

      try {
        const response = await fetch(csvLink);
        if(!response.ok) throw new Error("Gagal mengakses link CSV Google Sheets.");
        const csvText = await response.text();

        const lines = csvText.split("\n");
        const parsedSoal = [];

        for(let i = 1; i < lines.length; i++){
          const line = lines[i].trim();
          if(!line) continue;

          const cols = line.split(",").map(c => c.trim().replace(/^"|"$/g, ''));
          if(cols.length >= 8){
            parsedSoal.push({
              No: cols[0] || (parsedSoal.length + 1),
              Teks_Soal: cols[1],
              Opsi_A: cols[2],
              Opsi_B: cols[3],
              Opsi_C: cols[4],
              Opsi_D: cols[5],
              Opsi_E: cols[6],
              Kunci_Jawaban: cols[7].toUpperCase()
            });
          }
        }

        if(parsedSoal.length === 0){
          throw new Error("Format CSV tidak terbaca atau kosong. Pastikan kolom sesuai (No, Teks_Soal, Opsi_A-E, Kunci_Jawaban).");
        }

        parsedSoal.sort((a, b) => Number(a.No) - Number(b.No));

        await db.collection("morfologi_tryouts").doc(code).set({
          durasi: durasi,
          csvLink: csvLink,
          soal: parsedSoal,
          updated_at: firebase.firestore.FieldValue.serverTimestamp()
        });

        msgBox.textContent = `Sukses! Try Out ${code} berhasil dihubungkan (${parsedSoal.length} soal dimuat dari Sheet).`;
        msgBox.style.display = "block";
        document.getElementById("createForm").reset();
      } catch(err){
        alert("Gagal: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Simpan Link ke Firebase";
      }
    });
  }

  // ==========================================
  // 3. ARENA UJIAN & HASIL (SISWA)
  // ==========================================
  function renderExam(){
    const total = state.questions.length;
    const idx = state.currentIndex;
    const q = state.questions[idx];
    const currentAns = state.answers[idx];
    const isMarked = !!state.marked[idx];

    let optHtml = "";
    ["A", "B", "C", "D", "E"].forEach(letter => {
      if(!q["Opsi_" + letter]) return;
      const isSel = currentAns === letter;
      optHtml += `
        <div class="option-item ${isSel?'selected':''}" data-letter="${letter}">
          <div class="option-letter">${letter}</div>
          <div class="flex-grow-1">${escapeHtml(q["Opsi_" + letter])}</div>
        </div>
      `;
    });

    let gridHtml = "";
    for(let i=0; i<total; i++){
      let cls = [];
      if(state.marked[i]) cls.push("marked");
      else if(state.answers[i]) cls.push("answered");
      if(i === idx) cls.push("current");
      gridHtml += `<div class="nav-grid-item ${cls.join(' ')}" data-idx="${i}">${i+1}</div>`;
    }

    appEl.innerHTML = `
      <nav class="exam-navbar">
        <div class="container-fluid d-flex justify-content-between align-items-center">
          <div class="fw-bold"><i class="bi bi-pencil-square"></i> Try Out Online</div>
          <div class="d-flex align-items-center gap-3">
            <div class="timer-badge" id="timerBadge"><i class="bi bi-clock"></i> <span id="timerDisplay">--:--</span></div>
            <button class="btn btn-danger btn-sm fw-bold px-3" id="openSubmitModal">Kumpulkan</button>
          </div>
        </div>
      </nav>
      <div class="exam-body">
        <div class="row g-3">
          <div class="col-lg-8">
            <div class="question-panel">
              <div>
                <span class="question-index-badge">Soal ${idx+1} dari ${total}</span>
                <div class="question-text">${escapeHtml(q.Teks_Soal)}</div>
                <div id="optionsContainer">${optHtml}</div>
              </div>
              <div class="d-flex justify-content-between mt-auto pt-4 flex-wrap gap-2">
                <button class="btn btn-outline-secondary btn-sm px-3" id="prevBtn" ${idx===0?'disabled':''}>Sebelumnya</button>
                <button class="btn btn-outline-warning btn-sm px-3 ${isMarked?'active':''}" id="markBtn">Ragu-ragu</button>
                <button class="btn btn-outline-primary btn-sm px-3" id="nextBtn" ${idx===total-1?'disabled':''}>Berikutnya</button>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="nav-sidebar">
              <h6 class="fw-bold text-uppercase small text-muted mb-3">Navigasi Soal</h6>
              <div class="nav-grid">${gridHtml}</div>
            </div>
          </div>
        </div>
      </div>
    `;

    document.querySelectorAll(".option-item").forEach(el => {
      el.addEventListener("click", () => {
        state.answers[idx] = el.getAttribute("data-letter");
        saveState();
        renderExam();
      });
    });

    document.getElementById("prevBtn").addEventListener("click", () => navigate(idx - 1));
    document.getElementById("nextBtn").addEventListener("click", () => navigate(idx + 1));
    document.getElementById("markBtn").addEventListener("click", () => {
      if(state.marked[idx]) delete state.marked[idx]; else state.marked[idx] = true;
      saveState();
      renderExam();
    });

    document.querySelectorAll(".nav-grid-item").forEach(el => {
      el.addEventListener("click", () => navigate(parseInt(el.getAttribute("data-idx"))));
    });

    document.getElementById("openSubmitModal").addEventListener("click", () => {
      new bootstrap.Modal(document.getElementById("submitModal")).show();
    });

    document.getElementById("confirmSubmitBtn").onclick = () => {
      bootstrap.Modal.getInstance(document.getElementById("submitModal")).hide();
      submitExam();
    };

    updateTimerDisplay();
  }

  function navigate(i){
    if(i < 0 || i >= state.questions.length) return;
    state.currentIndex = i;
    saveState();
    renderExam();
  }

  function startTimer(){
    if(timerIntervalId) clearInterval(timerIntervalId);
    timerIntervalId = setInterval(() => {
      updateTimerDisplay();
      if(state.endTime - Date.now() <= 0){
        clearInterval(timerIntervalId);
        submitExam();
      }
    }, 1000);
  }

  function updateTimerDisplay(){
    if(!state) return;
    const rem = state.endTime - Date.now();
    const disp = document.getElementById("timerDisplay");
    const badge = document.getElementById("timerBadge");
    if(!disp) return;

    const totalSec = Math.max(0, Math.floor(rem / 1000));
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    disp.textContent = String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');

    if(rem <= 300000 && badge) badge.classList.add("timer-danger");
  }

  function submitExam(){
    if(timerIntervalId) clearInterval(timerIntervalId);
    
    let correct = 0, wrong = 0, empty = 0;
    state.questions.forEach((q, i) => {
      const userAns = state.answers[i];
      if(!userAns) empty++;
      else if(userAns === (q.Kunci_Jawaban || "").trim().toUpperCase()) correct++;
      else wrong++;
    });

    const score = Math.round((correct / state.questions.length) * 100);
    const resName = state.userName;
    clearState();

    appEl.innerHTML = `
      <div class="result-wrapper">
        <div class="custom-card text-center">
          <div class="system-logo mx-auto"><i class="bi bi-award-fill"></i></div>
          <h5 class="fw-bold">${escapeHtml(resName)}</h5>
          <p class="text-muted small">Ujian Telah Selesai</p>
          <div class="text-muted small">Skor Akhir</div>
          <div class="result-score">${score}</div>
          <div class="result-stats">
            <div class="stat-box correct"><div class="num">${correct}</div><div class="text-muted small">Benar</div></div>
            <div class="stat-box wrong"><div class="num">${wrong}</div><div class="text-muted small">Salah</div></div>
            <div class="stat-box empty"><div class="num">${empty}</div><div class="text-muted small">Kosong</div></div>
          </div>
          <button class="btn-custom mt-4" onclick="window.location.hash=''; window.location.reload();">Keluar / Ujian Baru</button>
        </div>
      </div>
    `;
  }

  function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function loadState(){ 
    const r = localStorage.getItem(STORAGE_KEY); 
    return r ? JSON.parse(r) : null; 
  }
  function clearState(){ localStorage.removeItem(STORAGE_KEY); state = null; }
  function escapeHtml(str){ return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  window.addEventListener("DOMContentLoaded", router);
})();
</script>
</body>
</html>
